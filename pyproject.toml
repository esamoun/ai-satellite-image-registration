[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satreg"
version = "0.1.0"
description = "Aligning satellite images to a tenth of a pixel: classic methods vs AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eithan Samoun" }]

dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
satreg = "satreg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
