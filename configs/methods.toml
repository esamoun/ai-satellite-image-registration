# Parameters of the registration methods, one [methods.<name>] table per method
# that has any. The reasoning behind the values is in docs/decisions.md.

# SIFT keypoints, Lowe's ratio test, affine transform fitted by RANSAC.
#   ratio             keep a match if its distance is below ratio x the second best
#   ransac_threshold  largest reprojection error of an inlier, in px
#   min_inliers       fewer inliers than this is reported as a failure
[methods.sift_ransac]
ratio = 0.75
ransac_threshold = 1.0
min_inliers = 10

# AROSICS global co-registration (COREG), an optional extra.
#   window           side of the matching window, in px
#   max_shift        largest shift component accepted, in px
#   max_iter         attempts at finding a valid integer peak
#   min_reliability  AROSICS' reliability below this, in %, is a failure
[methods.arosics]
window = 256
max_shift = 5.0
max_iter = 5
min_reliability = 40.0

# Variants: a table with a `method` key is a new method, built like the method it
# names with the table's other keys as parameters. `satreg benchmark` runs them
# only when they are named in --methods or in a run config.

# Phase correlation on images centred and tapered by a Hann window.
#   window  apodisation window, "hann"
[methods.phase_correlation_hann]
method = "phase_correlation"
window = "hann"

# AROSICS at the 60 % floor it used before the N1 run (see docs/decisions.md).
[methods.arosics_floor60]
method = "arosics"
min_reliability = 60.0
