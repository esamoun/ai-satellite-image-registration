# Parameters of the registration methods, one [methods.<name>] table per method
# that has any. The reasoning behind the values is in docs/decisions.md.

# SIFT keypoints, Lowe's ratio test, affine transform fitted by RANSAC.
#   ratio             keep a match if its distance is below ratio x the second best
#   ransac_threshold  largest reprojection error of an inlier, in px
#   min_inliers       fewer inliers than this is reported as a failure
[methods.sift_ransac]
ratio = 0.75
ransac_threshold = 1.0
min_inliers = 10

# AROSICS global co-registration (COREG), an optional extra.
#   window           side of the matching window, in px
#   max_shift        largest shift component accepted, in px
#   max_iter         attempts at finding a valid integer peak
#   min_reliability  AROSICS' reliability below this, in %, is a failure
[methods.arosics]
window = 256
max_shift = 5.0
max_iter = 5
min_reliability = 40.0

# RAFT optical flow with torchvision's pretrained weights, an optional extra.
#   model       "large" (5.3 M parameters) or "small" (1.0 M)
#   iterations  recurrent refinements of the flow
#   device      "cpu", "mps" or "cuda"; never picked automatically
[methods.raft]
model = "large"
iterations = 12
device = "cpu"

# LightGlue matching learned keypoints, affine transform fitted by RANSAC, an
# optional extra.
#   features          keypoint extractor, "aliked" or "disk"
#   max_keypoints     most keypoints kept per image, the strongest
#   match_threshold   keep a match whose confidence is above this, in [0, 1)
#   ransac_threshold  largest reprojection error of an inlier, in px
#   min_inliers       fewer inliers than this is reported as a failure
#   device            "cpu", "mps" or "cuda"; never picked automatically
[methods.lightglue]
features = "aliked"
max_keypoints = 2048
match_threshold = 0.1
ransac_threshold = 1.0
min_inliers = 10
device = "cpu"

# RoMa, a dense matcher on a DINOv2 backbone, outdoor weights, an optional extra
# (make install-roma).
#   output                "affine", an affine transform fitted by RANSAC to the
#                         warp, or "dense", the warp at every pixel
#   resolution            side of RoMa's working grid, in px, a multiple of 14
#   upsample_resolution   side of a second, refining pass, in px, 0 for none
#   certainty_threshold   a pixel whose certainty is at least this is certain
#   min_certain_fraction  fewer certain pixels than this is reported as a failure
#   max_matches           most lattice pixels given to the affine fit
#   ransac_threshold      largest reprojection error of an inlier, in px
#   min_inliers           fewer inliers than this is reported as a failure
#   device                "cpu", "mps" or "cuda"; never picked automatically
[methods.roma]
output = "affine"
resolution = 280
upsample_resolution = 0
certainty_threshold = 0.5
min_certain_fraction = 0.005
max_matches = 5000
ransac_threshold = 1.0
min_inliers = 10
device = "cpu"

# Variants: a table with a `method` key is a new method, built like the method it
# names with the table's other keys as parameters. `satreg benchmark` runs them
# only when they are named in --methods or in a run config.

# Phase correlation on images centred and tapered by a Hann window.
#   window  apodisation window, "hann"
[methods.phase_correlation_hann]
method = "phase_correlation"
window = "hann"

# AROSICS at the 60 % floor it used before the N1 run (see docs/decisions.md).
[methods.arosics_floor60]
method = "arosics"
min_reliability = 60.0

# RAFT's small model, five times fewer parameters.
[methods.raft_small]
method = "raft"
model = "small"

# RAFT fine-tuned on training pairs (N3), with the published weights: the kept
# checkpoint of the retained training, an asset of a GitHub release, downloaded
# to PyTorch's cache on first use and checked against the SHA-256 pinned in
# src/satreg/weights.py (docs/running.md, "Fine-tuned weights").
#   release  name of the published weights, a key of weights.RELEASED
[methods.raft_ft]
method = "raft"
release = "raft_large_ft"

# The same for the small model.
[methods.raft_small_ft]
method = "raft"
model = "small"
release = "raft_small_ft"

# The refinement axis of the cost curve (N3): the four models above with 8 and
# 4 refinements in place of 12, the count the fine-tuned ones were trained
# with. No retraining: the weights are the same, the loop stops earlier.
[methods.raft_r8]
method = "raft"
iterations = 8

[methods.raft_r4]
method = "raft"
iterations = 4

[methods.raft_small_r8]
method = "raft"
model = "small"
iterations = 8

[methods.raft_small_r4]
method = "raft"
model = "small"
iterations = 4

[methods.raft_ft_r8]
method = "raft"
release = "raft_large_ft"
iterations = 8

[methods.raft_ft_r4]
method = "raft"
release = "raft_large_ft"
iterations = 4

[methods.raft_small_ft_r8]
method = "raft"
model = "small"
release = "raft_small_ft"
iterations = 8

[methods.raft_small_ft_r4]
method = "raft"
model = "small"
release = "raft_small_ft"
iterations = 4

# RAFT run by ONNX Runtime on the CPU, without PyTorch, an optional extra
# (make install-onnx). A file holds one model, its weights and a fixed number
# of refinements, so each method above has its twin here, under its name with
# `_onnx`: the same model, read from the file `satreg export` wrote for it.
#   file     path of an ONNX file, relative to the working directory
#   release  or the name of a published one, a key of weights.RELEASED_ONNX,
#            downloaded on first use and checked like the weights
#   threads  threads a call may use, 0 to let ONNX Runtime choose; 4 is what
#            PyTorch takes on the M1, its performance cores
# The pretrained models are not published again: `satreg export` writes their
# files to outputs/onnx from torchvision's weights.

[methods.raft_onnx]
file = "outputs/onnx/raft_large_r12.onnx"
threads = 4

[methods.raft_r8_onnx]
method = "raft_onnx"
file = "outputs/onnx/raft_large_r8.onnx"
threads = 4

[methods.raft_r4_onnx]
method = "raft_onnx"
file = "outputs/onnx/raft_large_r4.onnx"
threads = 4

[methods.raft_small_onnx]
method = "raft_onnx"
file = "outputs/onnx/raft_small_r12.onnx"
threads = 4

[methods.raft_small_r8_onnx]
method = "raft_onnx"
file = "outputs/onnx/raft_small_r8.onnx"
threads = 4

[methods.raft_small_r4_onnx]
method = "raft_onnx"
file = "outputs/onnx/raft_small_r4.onnx"
threads = 4

# The fine-tuned models, from the release.
[methods.raft_ft_onnx]
method = "raft_onnx"
release = "raft_large_ft_r12"
threads = 4

[methods.raft_ft_r8_onnx]
method = "raft_onnx"
release = "raft_large_ft_r8"
threads = 4

[methods.raft_ft_r4_onnx]
method = "raft_onnx"
release = "raft_large_ft_r4"
threads = 4

[methods.raft_small_ft_onnx]
method = "raft_onnx"
release = "raft_small_ft_r12"
threads = 4

[methods.raft_small_ft_r8_onnx]
method = "raft_onnx"
release = "raft_small_ft_r8"
threads = 4

[methods.raft_small_ft_r4_onnx]
method = "raft_onnx"
release = "raft_small_ft_r4"
threads = 4

# Int8 copies of the fine-tuned files, as `satreg quantize` writes them to
# outputs/onnx (configs/quantization.toml): each under the name of its float
# twin with `_int8` for a static copy, calibrated on validation pairs, and
# `_int8_dynamic` for a dynamic one. `satreg int8` scores them next to their
# twin. The static copies of RAFT large are published, and downloaded like
# their twins; the three others are not (docs/decisions.md) and are read from
# where `satreg quantize` writes them.
[methods.raft_ft_onnx_int8]
method = "raft_onnx"
release = "raft_large_ft_r12_int8"
threads = 4

[methods.raft_ft_r8_onnx_int8]
method = "raft_onnx"
release = "raft_large_ft_r8_int8"
threads = 4

[methods.raft_ft_r4_onnx_int8]
method = "raft_onnx"
release = "raft_large_ft_r4_int8"
threads = 4

[methods.raft_ft_onnx_int8_dynamic]
method = "raft_onnx"
file = "outputs/onnx/raft_large_ft_r12_int8_dynamic.onnx"
threads = 4

[methods.raft_small_ft_onnx_int8]
method = "raft_onnx"
file = "outputs/onnx/raft_small_ft_r12_int8.onnx"
threads = 4

[methods.raft_small_ft_onnx_int8_dynamic]
method = "raft_onnx"
file = "outputs/onnx/raft_small_ft_r12_int8_dynamic.onnx"
threads = 4

# A training still at work: the weights of a checkpoint written by
# `satreg train`, read from where it writes by default.
#   checkpoint  path of the checkpoint, relative to the working directory
[methods.raft_ft_local]
method = "raft"
checkpoint = "outputs/train/raft_ft/checkpoint.pt"

[methods.raft_small_ft_local]
method = "raft"
model = "small"
checkpoint = "outputs/train/raft_small_ft/checkpoint.pt"

# The two variants of the ablation (N3), RAFT large trained by
# configs/train-same-date.toml and configs/train-cross-date.toml: the weights
# each run kept, its best.pt, brought back from Kaggle (docs/kaggle.md).
[methods.raft_ft_same_date]
method = "raft"
checkpoint = "outputs/train/large-same-date/best.pt"

[methods.raft_ft_cross_date]
method = "raft"
checkpoint = "outputs/train/large-cross-date/best.pt"

# RAFT small trained with the retained variant's pairs (N3), by
# configs/train-small.toml: the best.pt of that run.
[methods.raft_small_ft_cross_date]
method = "raft"
model = "small"
checkpoint = "outputs/train/small-cross-date/best.pt"

# LightGlue on DISK keypoints, which sit on whole pixels.
[methods.lightglue_disk]
method = "lightglue"
features = "disk"

# RoMa's warp read at every pixel as a Dense displacement.
[methods.roma_dense]
method = "roma"
output = "dense"
