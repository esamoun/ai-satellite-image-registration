[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satreg"
version = "0.1.0"
description = "Aligning satellite images to a tenth of a pixel: classic methods vs AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eithan Samoun" }]

dependencies = [
    # Georeferencing maps points with the @ operator, which affine 3.0 introduced;
    # rasterio accepts any affine, and images such as Kaggle's ship 2.x.
    "affine>=3.0",
    # Figures of the false-change experiment.
    "matplotlib",
    "numpy",
    "opencv-python-headless>=4.5",
    "pystac-client",
    "rasterio",
    "scipy",
    "scikit-image",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# Needs GDAL's Python bindings built against a system GDAL: see the README.
arosics = ["arosics"]
# PyTorch for the pretrained deep-learning methods; weights go to PyTorch's cache.
# kornia 0.8.3 is the first release with ALIKED.
dl = ["torch>=2.0", "torchvision>=0.15", "kornia>=0.8.3"]
# What RoMa imports besides the dl extra. romatch itself is installed without its
# declared dependencies, by make install-roma: see the Makefile.
roma = ["einops", "loguru"]
# ONNX Runtime for the exported RAFT models, which run without PyTorch, and onnx
# to write them (with the dl extra): see `satreg export`.
onnx = ["onnx", "onnxruntime"]

[project.scripts]
satreg = "satreg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# rasterio itself still uses the affine `*` operator.
filterwarnings = ["ignore::PendingDeprecationWarning:rasterio"]
